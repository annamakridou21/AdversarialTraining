name: Tests

on:
  push:
  pull_request:

jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Test attacks, metrics, training, and resume
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q attacks.py model_arch.py training.py utils.py scripts tests
      - name: Verify published study artifacts
        run: python -m scripts.verify_release
      - name: Check shell syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/run_all_analysis.sh
